<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#107c10"><title>My Game Vault</title><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/styles.css"></head><body><header><div class="orb">V</div><div><p class="eyebrow">PERSONAL COLLECTION</p><h1>MY GAME VAULT</h1></div></header><main><section class="search"><input id="search" type="search" placeholder="Search your collection…" autocomplete="off"></section><section id="home"><div class="cards"><button class="collection-card" data-view="xbox"><span class="kicker">MY</span><strong>Xbox Collection</strong><span id="xboxTotal" class="count">0 games</span><small><span id="xb1">0 Xbox One</span> · <span id="xsx">0 Series X</span></small></button><button class="collection-card switch" data-view="switch"><span class="kicker">MY</span><strong>Nintendo Switch</strong><span id="switchTotal" class="count">0 games</span><small>Physical collection</small></button></div><div class="actions"><button id="addBtn">＋ Add Game</button><button id="backupBtn">↕ Backup & Restore</button></div></section><section id="library" hidden><div class="bar"><button id="backBtn">‹ Home</button><h2 id="libraryTitle">Collection</h2></div><div id="grid" class="grid"></div><p id="empty" class="empty">No games found.</p></section></main><footer><b>MY GAME VAULT</b><span>Personal game collection manager. Not affiliated with or endorsed by Microsoft or Nintendo.</span></footer><dialog id="gameDialog"><form method="dialog" id="gameForm"><div class="dialog-head"><h2 id="dialogTitle">Add Game</h2><button value="cancel" class="icon">×</button></div><input type="hidden" id="gameId"><label>Title<input id="title" required></label><div class="two"><label>Platform<select id="platform"><option>Xbox One</option><option>Xbox Series X</option><option>Nintendo Switch</option></select></label><label>Edition<input id="edition" value="Standard"></label></div><label>Cover image URL<input id="coverUrl" type="url" placeholder="https://…"></label><label>Summary<textarea id="summary" rows="3"></textarea></label><div class="two"><label>Release date<input id="releaseDate" type="date"></label><label>Genre<input id="genre"></label><label>ESRB<input id="esrb"></label><label>UPC / Barcode<input id="upc"></label><label>Developer<input id="developer"></label><label>Publisher<input id="publisher"></label><label>Local players<input id="localPlayers"></label><label>Online players<input id="onlinePlayers"></label></div><div class="checks"><label><input id="localCoop" type="checkbox"> Local co-op</label><label><input id="onlineCoop" type="checkbox"> Online co-op</label><label><input id="splitScreen" type="checkbox"> Split-screen</label></div><label>Notes<textarea id="notes" rows="2"></textarea></label><p id="formError" class="error"></p><div class="dialog-actions"><button value="cancel" class="secondary">Cancel</button><button type="submit" value="default">Save Game</button></div></form></dialog><dialog id="detailDialog"><div id="details"></div></dialog><dialog id="backupDialog"><div class="dialog-head"><h2>Backup & Restore</h2><button class="icon" onclick="backupDialog.close()">×</button></div><p>Export a portable JSON copy of your collection or restore one safely.</p><button id="exportBtn">Create Backup</button><label class="file">Restore Backup<input id="restoreFile" type="file" accept="application/json"></label><div id="restorePreview"></div></dialog><script src="/app.js" type="module"></script></body></html>
